<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Student Complaint System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-card">

        <!-- LOGIN HEADER -->
        <div class="text-center mb-4">

            <img src="images/logo_aduan.png"
                 alt="UiTM Complaint System Logo"
                 class="brand-logo mb-3">

            <h3 class="fw-bold">Welcome Back</h3>

            <p class="text-muted">
                Login to Student Complaint Management System
            </p>

        </div>


        <!-- LOGIN FORM -->
        <form onsubmit="loginUser(event)">

            <div class="mb-3">

                <label class="form-label" for="userID">
                    User ID (Student / Staff ID)
                </label>

                <input type="text"
                       class="form-control"
                       id="userID"
                       placeholder="Enter your Student or Staff ID"
                       required>

            </div>


            <div class="mb-4">

                <label class="form-label" for="password">
                    Password
                </label>

                <input type="password"
                       class="form-control"
                       id="password"
                       placeholder="Enter your password"
                       required>

            </div>


            <button type="submit" class="btn-login">
                Login
                <i class="bi bi-arrow-right ms-2"></i>
            </button>

            <p id="message" class="text-center mt-3 mb-0"></p>

        </form>


        <!-- BACK TO HOMEPAGE -->
        <div class="text-center mt-4">

            <a href="index.html" class="back-link">
                <i class="bi bi-arrow-left"></i>
                Back to Homepage
            </a>

        </div>

    </div>

    <script src="js/auth.js"></script>
</body>
</html>
